<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>القرآن الكريم| Simple Quran Player</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101820 url('https://images.pexels.com/photos/908055/pexels-photo-908055.jpeg?_gl=1*1076mgy*_ga*ODc3NDE5OTIuMTc1ODE4Nzg5Ng..*_ga_8JE65Q40S6*czE3NjE0MTE3NzkkbzQkZzEkdDE3NjE0MTE4NTAkajUwJGwwJGgw') no-repeat center center fixed;
      background-size: cover;
      color: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    /* 🔽 Add this part right after body */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0, 0, 0, 0.6); /* dark overlay */
    z-index: -1; /* keeps overlay behind content */
  }
    .container {
      background-color: #4a466500;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(255,255,255,0.2);
      width: 320px;
      text-align:center;
    }
    h1 {
      color: #f4f8ed;
      font-size: 22px;
      margin-bottom: 15px;
    }
    label {
      display: block;
      text-align: left;
      margin-top: 10px;
      color: #f5f5f5;
    }
    select, input, button {
      width:100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: none;
      font-size: 14px;
    }
    select, input {
      background: #0f1c2b;
      color: #fff;
    }
    button {
      background-color: #dae0e1;
      color: #000;
      cursor: pointer;
      font-weight: bold;
      margin-top: 15px;
    }
    audio {
      width: 100%;
      margin-top: 15px;
    }
    #ayahText {
      margin-top: 20px;
      font-size: 20px;
      direction: rtl;
      line-height: 1.8;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Quran Player</h1>
<!-- Only Minshawi and Yasser AL-Dosari Work Beacuse Of free API. -->
    <label for="qari">Select Qari:</label>
    <select id="qari">
      <option value="minshawi">Minshawi</option>
      <option value="yasser_ad-dussary">Yasser Al-Dosari</option>
      <option value="shuraym">saud_ash_shuraym</option>
      <option value="al-sudais">abdurrahmaan_as_sudais</option>

    </select>

    <label for="surah">Surah Number (1–114):</label>
    <input type="number" id="surah" min="1" max="114" placeholder="e.g. 1">

    <label for="ayah">Ayah Number (optional):</label>
    <input type="number" id="ayah" min="1" placeholder="leave blank for full surah">

    <button id="playBtn">Play</button>

    <audio id="audioPlayer" controls></audio>

    <div id="ayahText"></div>
  </div>

  <script>
    document.getElementById("playBtn").addEventListener("click", async function() {
      const qari = document.getElementById("qari").value;
      const surah = document.getElementById("surah").value;
      const ayah = document.getElementById("ayah").value;
      const player = document.getElementById("audioPlayer");
      const ayahText = document.getElementById("ayahText");

      if (!surah) {
        alert("Surah number between 1 and 114.");
        return;
      }

      // format surah number to 3 digits for the Quran audio URL (e.g. 001, 002, etc.)
      const surahStr = String(surah).padStart(3, '0');

      if (ayah) {
        // Fetch single ayah text and its audio reciter version
        try {
          const res = await fetch(`https://api.alquran.cloud/v1/ayah/${surah}:${ayah}/ar.${qari}`);
          const data = await res.json();
          if (data.status === "OK") {
            const text = data.data.text;
            ayahText.innerHTML = text;
            player.src = data.data.audio || `https://download.quranicaudio.com/quran/${qari}/${surahStr}.mp3`;
            player.play();
          } else {
            ayahText.innerHTML = "Ayah not found.";
          }
        } catch (e) {
          console.error(e);
          ayahText.innerHTML = "Error loading ayah.";
        }
      } else {
        // Play full surah
        ayahText.innerHTML = "";
        const fullSurahUrl = `https://download.quranicaudio.com/quran/${qari}/${surahStr}.mp3`;
        player.src = fullSurahUrl;
        player.play().catch(() => {
          alert("Full surah audio not available for this Qari.");
        });
      }
    });
  </script>
</body>
</html>
